services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oqs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oqs}
    ports:
      - "127.0.0.1:${OQS_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oqs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oqs}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: runtime
    environment: &application_environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-oqs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oqs}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OQS_ENCRYPTION_KEY: ${OQS_ENCRYPTION_KEY:?Set OQS_ENCRYPTION_KEY in .env}
      OQS_DISABLE_REGISTRATION: ${OQS_DISABLE_REGISTRATION:-false}
      OQS_STORAGE_DRIVER: ${OQS_STORAGE_DRIVER:-local}
      OQS_ASSET_DIR: /app/data/assets
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-assets}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
    volumes:
      - brand_assets:/app/data/assets
    ports:
      - "127.0.0.1:${OQS_WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    environment: *application_environment
    volumes:
      - brand_assets:/app/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  brand_assets:
