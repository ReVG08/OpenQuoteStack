name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: oqs
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: oqs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oqs -d oqs_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://oqs:ci-test-password@localhost:5432/oqs_test
      DATABASE_TEST_URL: postgresql://oqs:ci-test-password@localhost:5432/oqs_test
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
