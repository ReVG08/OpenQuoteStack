name: Bug report
description: Report a reproducible product or package failure.
body:
  - type: markdown
    attributes:
      value: Do not include secrets or real customer records. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal fictional estimator or example if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, deployment method and browser/runtime
    validations:
      required: true
